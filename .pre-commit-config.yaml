# Pre-commit hooks. Install once with `uv run poe hooks-install`.
# Ruff and ty run via `uv run` so they use the exact versions pinned in the project
# (same as `poe check` and CI) — no second toolchain to keep in sync.
default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: ruff-lint
        name: ruff (lint + autofix)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ty
        name: ty (type-check)
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
