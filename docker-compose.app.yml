# The deployable half of the stack: the API and the worker, built from this repo, running
# against the dependencies in docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.app.yml up -d --build
#
# docker-compose.yml alone gives you Postgres, Redis and MinIO for `poe dev` on the host. This
# file is what proves the *application* can be built and run somewhere that is not a laptop —
# without it "deployment" was a set of commands nobody had executed together.
services:
  migrate:
    build: { context: ., target: api }
    command: ["alembic", "upgrade", "head"]
    environment: &app_env
      GURU_ENV: dev
      GURU_DATABASE_URL: postgresql+asyncpg://guru:guru@postgres:5432/guru
      GURU_REDIS_URL: redis://redis:6379/0
      GURU_BLOB_ENDPOINT_URL: http://minio:9000
      GURU_CORS_ORIGINS: '["http://localhost:5173"]'
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: { context: ., target: api }
    environment: *app_env
    ports: ["8000:8000"]
    depends_on:
      # Migrations run to completion before anything serves: an instance that starts against
      # a schema it does not match will answer readiness and then fail every request.
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    build: { context: ., target: worker }
    environment: *app_env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
