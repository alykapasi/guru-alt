name: Set up the frontend toolchain
description: >-
  Node 22 and the locked npm dependency set. The install is pinned to `frontend/` here rather
  than inherited from the job: a job's `defaults.run.working-directory` does not reach inside
  a composite action, so relying on it would silently run `npm ci` at the repository root.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: "22"
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci
      shell: bash
      working-directory: frontend
