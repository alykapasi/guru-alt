name: Set up the backend toolchain
description: >-
  uv, Python 3.13, and the locked dependency set. Defined once so a version bump lands in
  every backend job at once, rather than in whichever copies someone remembered to edit.

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.13"
        enable-cache: true

    - name: Install dependencies
      run: uv sync --frozen
      shell: bash
