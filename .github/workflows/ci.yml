name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One gate per job, all in parallel. The point is the failure message: a red `type-check`
# names the problem from the checks list, where a red `lint · type-check · test · migrate`
# only says that one of four things went wrong and hid the other three behind it — a job
# stops at its first failing step, so bundling them means each run reports at most one.
#
# The shared toolchain setup lives in `.github/actions/setup-*`; GitHub Actions does not
# support YAML anchors, so a composite action is the only way to write it once. `services`
# is job-level and cannot go in one, which is why the Postgres block below appears twice —
# in the two jobs that actually need a database, and nowhere else.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-backend

      # Both are ruff and both are fixed the same way (`poe format`), so they are one gate.
      - name: Format check
        run: uv run poe format-check

      - name: Lint
        run: uv run poe lint

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-backend

      - name: Type-check
        run: uv run poe type-check

  test:
    name: test
    runs-on: ubuntu-latest

    env:
      GURU_ENV: test
      # CI Postgres is on the service's localhost:5432 (overrides the 5433 dev default).
      GURU_DATABASE_URL: postgresql+asyncpg://guru:guru@localhost:5432/guru

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: guru
          POSTGRES_PASSWORD: guru
          POSTGRES_DB: guru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guru -d guru"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-backend

      # `poe test` creates and migrates its own `_test` database (tests/testdb.py), so it
      # needs a server but not the migrated `guru` database the `migrations` job builds.
      # That independence is what lets these two run side by side instead of in sequence.
      - name: Test
        run: uv run poe test

  migrations:
    name: migrations
    runs-on: ubuntu-latest

    env:
      GURU_ENV: test
      GURU_DATABASE_URL: postgresql+asyncpg://guru:guru@localhost:5432/guru

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: guru
          POSTGRES_PASSWORD: guru
          POSTGRES_DB: guru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guru -d guru"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-backend

      - name: Apply migrations
        run: uv run alembic upgrade head

      # Catches a model changed without a matching migration — the class of drift that
      # only shows up when someone else's fresh database won't match their ORM.
      - name: Check for un-migrated model drift
        run: uv run poe db-check

      # A rollback plan is only real if `downgrade` runs. Each migration is taken back down
      # and re-applied, so a revision with a broken or missing downgrade fails here rather
      # than during the incident that needs it (S60). This proves the step executes; it does
      # not prove it is lossless — a contracting migration drops data by design.
      - name: Migrations round-trip
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  # Delivery through a real broker, which the default suite cannot show: it runs on
  # `InMemoryBroker`, which never serialises a message, never writes it anywhere and never
  # reads it back on another connection (S58). Its own job rather than a step in `test`,
  # because it is the only one needing Redis and bundling it would start a broker for every
  # run of the suite.
  queue:
    name: queue
    runs-on: ubuntu-latest

    env:
      GURU_ENV: test
      GURU_DATABASE_URL: postgresql+asyncpg://guru:guru@localhost:5432/guru
      GURU_REDIS_URL: redis://localhost:6379/0
      # The gate these tests skip behind, so a laptop without Redis still runs a green suite
      # and CI still covers the path.
      GURU_QUEUE_TESTS: "1"

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: guru
          POSTGRES_PASSWORD: guru
          POSTGRES_DB: guru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guru -d guru"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-backend

      # The suite's conftest reaches for its own database on import, so it has to exist even
      # for a test that never touches it.
      - name: Create the suite's database
        run: uv run poe test-db-init

      - name: Queue integration
        run: uv run pytest tests/test_queue_integration.py -v

  # The frontend's typed client is generated from the backend's OpenAPI document, so the two
  # are a contract with two sides and, until recently, no gate: a backend change that removed
  # a field or renamed a route could merge while the frontend kept compiling against the
  # shape that used to be there. This regenerates the types and fails on any difference (S58).
  api-contract:
    name: api contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-backend
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # No database and no server: the document comes from the app object, which is what lets
      # this be a check rather than something somebody has to remember to run.
      - name: Frontend types match the API
        run: uv run poe api-contract

  frontend-lint:
    name: frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-frontend

      - name: Lint
        run: npm run lint

  frontend-test:
    name: frontend test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-frontend

      - name: Test
        run: npm run test

  frontend-build:
    name: frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-frontend

      # `tsc -b && vite build` — the type-check gate for the frontend as well as the build.
      - name: Build
        run: npm run build

  # The half of the product no other gate can reach (S58). The backend tests drive the turn
  # function directly and never serialise an SSE frame; the component tests render the chat
  # against a mocked client and never make a request. The seam between them — the event
  # stream, the credentialed cross-origin fetch, the cookie the browser decides whether to
  # send — is exactly where a change breaks the product while both suites stay green.
  #
  # Both toolchains, because it runs the real API against the real built bundle. No Redis and
  # no object store: these journeys touch neither, and starting them would be starting
  # dependencies to watch them idle.
  e2e:
    name: browser journeys
    runs-on: ubuntu-latest

    env:
      GURU_ENV: dev
      GURU_DATABASE_URL: postgresql+asyncpg://guru:guru@localhost:5432/guru
      GURU_REDIS_URL: redis://localhost:6379/0

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: guru
          POSTGRES_PASSWORD: guru
          POSTGRES_DB: guru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guru -d guru"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # The upload journey's file is ingested by a queued job, so this job needs somewhere for
      # that job to queue. `scripts/e2e-backend.sh` runs the worker that drains it.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-backend
      - uses: ./.github/actions/setup-frontend

      # Where the uploaded bytes actually go. Brought up from the project's own compose file
      # rather than restated here, so the journey environment is the one a developer runs and
      # there is no second definition to keep in step. It cannot be a `services:` container:
      # its bucket is created by a one-shot bootstrap, and a service container can only be given
      # an image and its environment. `run --rm` on the bootstrap blocks until the bucket exists,
      # so the first upload cannot race the bucket being created.
      - name: Object store for uploads
        run: |
          docker compose up -d rustfs
          docker compose run --rm rustfs-bootstrap

      # Chromium only, and `--with-deps` because the runner image has none of the shared
      # libraries a browser needs. One engine is a deliberate limit: these journeys are here
      # to cover the seam between the halves of the product, not to survey rendering engines.
      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # Playwright starts the API and the preview server itself (see playwright.config.ts) and
      # waits for both to answer, so there is no sleep here and no race on startup.
      - name: Browser journeys
        run: npm run e2e
        working-directory: frontend

      # Traces and video are captured only for a failure, so this uploads the evidence for a
      # red run and nothing at all for a green one.
      - name: Upload the failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # One check that is green only when all nine are. Splitting the gates multiplies the names
  # a branch-protection rule would have to list, and a rule that lists them by name silently
  # stops covering a gate the day one is renamed or added. This job is the stable name to
  # require; the eight above are where you look when it goes red.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - type-check
      - test
      - migrations
      - queue
      - api-contract
      - frontend-lint
      - frontend-test
      - frontend-build
      - e2e

    steps:
      - name: Summarise the gates
        run: |
          {
            echo "| gate | result |"
            echo "| --- | --- |"
            echo "| lint | ${{ needs.lint.result }} |"
            echo "| type-check | ${{ needs['type-check'].result }} |"
            echo "| test | ${{ needs.test.result }} |"
            echo "| migrations | ${{ needs.migrations.result }} |"
            echo "| queue | ${{ needs.queue.result }} |"
            echo "| api contract | ${{ needs['api-contract'].result }} |"
            echo "| frontend lint | ${{ needs['frontend-lint'].result }} |"
            echo "| frontend test | ${{ needs['frontend-test'].result }} |"
            echo "| frontend build | ${{ needs['frontend-build'].result }} |"
            echo "| browser journeys | ${{ needs.e2e.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # `success()` is not enough on its own here: with `if: always()` this job runs even when
      # a dependency was skipped or cancelled, and a skipped gate is an un-run gate, not a
      # passed one. Anything other than success in any of the nine fails this check.
      - name: Fail unless every gate succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "::error::At least one gate did not succeed — see the summary above."
          exit 1
