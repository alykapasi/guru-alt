name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · type-check · test · migrate
    runs-on: ubuntu-latest

    env:
      GURU_ENV: test
      # CI Postgres is on the service's localhost:5432 (overrides the 5433 dev default).
      GURU_DATABASE_URL: postgresql+asyncpg://guru:guru@localhost:5432/guru

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: guru
          POSTGRES_PASSWORD: guru
          POSTGRES_DB: guru
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guru -d guru"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format check
        run: uv run poe format-check

      - name: Lint
        run: uv run poe lint

      - name: Type-check
        run: uv run poe type-check

      - name: Apply migrations
        run: uv run alembic upgrade head

      # Catches a model changed without a matching migration — the class of drift that
      # only shows up when someone else's fresh database won't match their ORM.
      - name: Check for un-migrated model drift
        run: uv run poe db-check

      # A rollback plan is only real if `downgrade` runs. Each migration is taken back down
      # and re-applied, so a revision with a broken or missing downgrade fails here rather
      # than during the incident that needs it (S60). This proves the step executes; it does
      # not prove it is lossless — a contracting migration drops data by design.
      - name: Migrations round-trip
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      # `poe test` creates and migrates its own `_test` database (tests/testdb.py), so this
      # also exercises the migrations a second time against a genuinely empty database.
      - name: Test
        run: uv run poe test

  # The frontend's typed client is generated from the backend's OpenAPI document, so the two
  # are a contract with two sides and, until now, no gate: a backend change that removed a
  # field or renamed a route could merge while the frontend kept compiling against the shape
  # that used to be there. This regenerates the types and fails on any difference (S58).
  contract:
    name: api contract
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: uv sync --frozen

      # No database and no server: the document comes from the app object, which is what lets
      # this be a check rather than something somebody has to remember to run.
      - name: Frontend types match the API
        run: uv run poe api-contract

  frontend:
    name: frontend lint · test · build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # `tsc -b && vite build` — the type-check gate for the frontend as well as the build.
      - name: Build
        run: npm run build
