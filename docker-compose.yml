# Local dev dependencies. `docker compose up -d` then `uv run poe db-upgrade`.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: guru
      POSTGRES_PASSWORD: guru
      POSTGRES_DB: guru
    ports:
      # Host 5433 to avoid clashing with a system Postgres on the default 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guru -d guru"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object store for raw uploads (Phase 4). Console on :9001.
  #
  # RustFS rather than MinIO: MinIO stopped publishing public images (`minio/minio` is gone from
  # Docker Hub and quay.io answers an anonymous pull with 401), which is what broke the
  # browser-journeys job. Pinned so a moved `latest` cannot break CI the same way. The dev
  # credentials stay `minioadmin` so the app's defaults and the release guard are unchanged.
  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfsdata:/data

  # One-shot: create the uploads bucket, retrying until the store is reachable.
  rustfs-bootstrap:
    image: amazon/aws-cli:2.37.4
    depends_on:
      - rustfs
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      until aws --endpoint-url http://rustfs:9000 s3api list-buckets > /dev/null 2>&1; do sleep 1; done &&
      (aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket guru-uploads 2> /dev/null ||
       aws --endpoint-url http://rustfs:9000 s3api create-bucket --bucket guru-uploads) &&
      echo 'bucket ready'
      "

volumes:
  pgdata:
  redisdata:
  rustfsdata:
