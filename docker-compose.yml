# Local dev dependencies. `docker compose up -d` then `uv run poe db-upgrade`.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: guru
      POSTGRES_PASSWORD: guru
      POSTGRES_DB: guru
    ports:
      # Host 5433 to avoid clashing with a system Postgres on the default 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guru -d guru"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object store for raw uploads (Phase 4). Console on :9001.
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # One-shot: create the uploads bucket, retrying until MinIO is reachable.
  minio-bootstrap:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done &&
      mc mb --ignore-existing local/guru-uploads &&
      echo 'minio bucket ready'
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
