[project]
name = "guru-alt"
version = "0.1.0"
description = "Guru — AI-first personalized learning platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    # Runtime, not tooling: `alembic upgrade head` is a deployment step, and a production
    # image built with --no-dev could not run it while this sat in the dev group.
    "alembic>=1.18.5",
    "anthropic>=0.113.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "beartype>=0.22.9",
    "dspy>=3.3.1",
    "ebooklib>=0.20",
    "email-validator>=2.2.0",
    "fastapi>=0.138.2",
    "fsrs>=6.3.1",
    "greenlet>=3.5.3",
    "langgraph>=1.2.7",
    "langgraph-checkpoint-postgres>=2.0.0",
    "lxml>=6.1.1",
    "openai>=2.44.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.4.2",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "taskiq>=0.12.4",
    "taskiq-redis>=1.2.3",
    "trafilatura>=2.1.0",
    "uvicorn>=0.49.0",
]

[project.optional-dependencies]
# Heavy ASR runtime for audio/video ingestion, kept out of the core install (and CI, which
# tests the Transcriber seam with a fake). Install with: uv sync --extra asr
asr = [
    "faster-whisper>=1.0.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mlflow>=3.14.0",
    "poethepoet>=0.47.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.15.20",
    "ty>=0.0.55",
]

[tool.poe.tasks]
dev = "uvicorn app.main:app --reload"
worker = "taskiq worker app.workers.broker:broker app.workers.tasks"
test.cmd = "pytest -v"
test.deps = ["test-db-init"]
test.help = "Run the suite against its own database (see tests/testdb.py)"
test-watch = "pytest -v --tb=short -x"
test-db-init = "python -m tests.testdb"
type-check = "ty check"
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
db-upgrade = "alembic upgrade head"
db-downgrade = "alembic downgrade -1"
db-check = "alembic check"
eval = "python -m tests.eval.harness"
sweep = "python -m tests.eval.sweep"
sweep-report = "python -m tests.eval.sweep.report"
build-calibration-dataset = "python -m tests.eval.datasets"
replay-check = "python -m tests.eval.datasets.verify"
retrieval-recall = "python -m tests.eval.retrieval.recall"
simhash-separation = "python -m tests.eval.dedup.separation"
compile-prompt = "python -m tests.eval.prompts.compile"
prompt-report = "python -m tests.eval.prompts.report"
reconcile-ingestion = "python -m app.workers.reconcile"
backup-drill = "bash scripts/backup-drill.sh"
hooks-install = "pre-commit install"
hooks = "pre-commit run --all-files"
check.sequence = ["lint", "type-check", "test"]
check.help = "Run lint, type-check, and tests (the green gate)"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
